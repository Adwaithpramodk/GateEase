{% if messages %}
<style>
    .toast-container {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, calc(100vw - 32px));
        pointer-events: none;
    }
    .toast-message {
        pointer-events: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 48px;
        padding: 10px 12px;
        background-color: white;
        border: 1px solid #e2e8f0;
        border-left: 3px solid #4f46e5;
        border-radius: 10px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.12);
        font-family: 'Inter', sans-serif;
        animation: toast-in 0.25s ease-out;
        transition: transform 0.25s ease, opacity 0.25s ease;
        opacity: 1;
        transform: translateX(0);
    }
    .toast-success { border-left-color: #10b981; }
    .toast-error { border-left-color: #ef4444; }
    .toast-warning { border-left-color: #f59e0b; }
    .toast-icon {
        display: grid;
        flex: 0 0 24px;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 50%;
        background: #eef2ff;
        color: #4f46e5;
        font-size: 13px;
        font-weight: 800;
    }
    .toast-success .toast-icon { background: #ecfdf5; color: #059669; }
    .toast-error .toast-icon { background: #fef2f2; color: #dc2626; }
    .toast-warning .toast-icon { background: #fffbeb; color: #d97706; }
    .toast-content {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        font-size: 13px;
        line-height: 1.35;
        font-weight: 600;
        color: #1e293b;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        line-clamp: 2;
    }
    .toast-close {
        background: none;
        border: none;
        cursor: pointer;
        color: #94a3b8;
        flex: 0 0 24px;
        width: 24px;
        height: 24px;
        padding: 4px;
        border-radius: 50%;
    }
    .toast-close:hover {
        color: #475569;
        background-color: #f1f5f9;
    }
    .toast-hiding {
        opacity: 0;
        transform: translateX(110%);
    }
    @keyframes toast-in {
        from { opacity: 0; transform: translateX(24px); }
        to { opacity: 1; transform: translateX(0); }
    }
    @media (max-width: 640px) {
        .toast-container {
            top: 12px;
            right: 16px;
            width: calc(100vw - 32px);
        }
    }
</style>

<div class="toast-container" id="django-messages-container">
    {% for message in messages %}
    <div class="toast-message {% if 'success' in message.tags or 'info' in message.tags %}toast-success{% elif 'warning' in message.tags %}toast-warning{% elif 'error' in message.tags %}toast-error{% endif %}" id="toast-{{ forloop.counter }}">
        <div class="toast-icon" aria-hidden="true">
            {% if 'error' in message.tags or 'warning' in message.tags %}!{% else %}&#10003;{% endif %}
        </div>
        <div class="toast-content">
            {{ message }}
        </div>
        <button type="button" class="toast-close" onclick="closeToast('toast-{{ forloop.counter }}')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>
    
    <script>
        setTimeout(() => {
            closeToast('toast-{{ forloop.counter }}');
        }, 5000);
    </script>
    {% endfor %}
</div>

<script>
    function closeToast(id) {
        const toast = document.getElementById(id);
        if (toast) {
            toast.classList.add('toast-hiding');
            setTimeout(() => toast.remove(), 300);
        }
    }
</script>
{% endif %}

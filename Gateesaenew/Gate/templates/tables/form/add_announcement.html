{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Announcement</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4f46e5; --primary-hover: #4338ca; --bg: #f3f4f6; --text: #1f2937; --border: #e5e7eb; }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; background: var(--bg); font-family: Poppins, sans-serif; color: var(--text); }
        .container { width: 100%; max-width: 620px; margin: 40px auto; background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,.1); }
        .back { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-size: 14px; }
        h1 { margin: 0 0 8px; font-size: 24px; } .intro { margin: 0 0 28px; color: #6b7280; font-size: 14px; }
        .form-group { margin-bottom: 20px; } label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500; }
        input, textarea { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 8px; font: inherit; outline: none; }
        textarea { resize: vertical; min-height: 150px; } input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
        .hint { color: #6b7280; font-size: 12px; margin-top: 6px; }
        button { width: 100%; padding: 14px; border: 0; border-radius: 8px; background: var(--primary); color: #fff; font: 600 16px Poppins, sans-serif; cursor: pointer; }
        button:hover { background: var(--primary-hover); }
        @media (max-width: 640px) { .container { margin: 20px auto; padding: 25px; } }
    </style>
</head>
<body>
    {% include 'partials/messages.html' %}
    <main class="container">
        <a href="/ManageAnnouncements" class="back">&larr; Back to Announcements</a>
        <h1>New Announcement</h1>
        <p class="intro">Publish an update that will be visible to all students.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="title">Title</label>
                <input id="title" name="title" type="text" maxlength="200" placeholder="Announcement title" required>
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Write the announcement details..." required></textarea>
            </div>
            <div class="form-group">
                <label for="expires_at">Expiry (optional)</label>
                <input id="expires_at" name="expires_at" type="datetime-local">
                <div class="hint">Leave empty to keep this announcement visible until you delete it.</div>
            </div>
            <button type="submit">Publish Announcement</button>
        </form>
    </main>
</body>
</html>
